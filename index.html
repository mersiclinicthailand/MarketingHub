<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>Mersi Marketing Hub</title>
<style>
/* ============ BRAND FONTS ============
   ลำดับการหาไฟล์: ฟอนต์ในเครื่อง → .woff2 ใน assets/fonts → .ttf จาก Font.zip */
@font-face{font-family:'TT Ramillas';font-weight:300;font-display:swap;
  src:local('TT Ramillas Trial Light'),url('assets/fonts/TTRamillas-Light.woff2') format('woff2'),url('assets/fonts/TT Ramillas Trial Light.ttf') format('truetype')}
@font-face{font-family:'TT Ramillas';font-weight:500;font-display:swap;
  src:local('TT Ramillas Trial Medium'),url('assets/fonts/TTRamillas-Med.woff2') format('woff2'),url('assets/fonts/TT Ramillas Trial Medium.ttf') format('truetype')}
@font-face{font-family:'TT Ramillas';font-weight:700;font-display:swap;
  src:local('TT Ramillas Trial Bold'),url('assets/fonts/TTRamillas-Bd.woff2') format('woff2'),url('assets/fonts/TT Ramillas Trial Bold.ttf') format('truetype')}
@font-face{font-family:'DB Helvethaica X';font-weight:300;font-display:swap;
  src:local('DB Helvethaica X Li'),url('assets/fonts/DBHelvethaicaX-Li.woff2') format('woff2'),url('assets/fonts/DB Helvethaica X Li.ttf') format('truetype')}
@font-face{font-family:'DB Helvethaica X';font-weight:400;font-display:swap;
  src:local('DB Helvethaica X'),url('assets/fonts/DBHelvethaicaX-Reg.woff2') format('woff2'),url('assets/fonts/DB Helvethaica X v3.2.ttf') format('truetype')}
@font-face{font-family:'DB Helvethaica X';font-weight:500;font-display:swap;
  src:local('DB Helvethaica X Med'),url('assets/fonts/DBHelvethaicaX-Med.woff2') format('woff2'),url('assets/fonts/DB Helvethaica X Med v3.2.ttf') format('truetype')}
@font-face{font-family:'DB Helvethaica X';font-weight:700;font-display:swap;
  src:local('DB Helvethaica X Bd'),url('assets/fonts/DBHelvethaicaX-Bd.woff2') format('woff2'),url('assets/fonts/DB Helvethaica X Bd v3.2.ttf') format('truetype')}
@font-face{font-family:'DB HelvethaicaMon X';font-weight:500;font-display:swap;
  src:local('DB HelvethaicaMon X Med'),url('assets/fonts/DBHelvethaicaMonX-Med.woff2') format('woff2'),url('assets/fonts/DB HelvethaicaMon X Med.ttf') format('truetype')}

/* ============ MERSI QUIET LUXURY — LIGHT ============ */
:root{
  --cream:#F5F2EA; --cream-2:#EFEBE0; --paper:#FFFEFA;
  --ink:#23271F; --ink-soft:#5A5F53;
  --forest:#1B231D; --sage:#8B9478; --sage-deep:#76805F;
  --gold:#C2A369; --gold-deep:#A8894F; --gold-soft:#E7D9BB;
  --line:rgba(35,39,31,.10); --line-gold:rgba(194,163,105,.35);
  --shadow:0 18px 50px -18px rgba(27,35,29,.22);
  --ok:#4C8558; --warn:#B07A3D; --danger:#A4463C;
  --r-lg:18px; --r-md:14px; --r-sm:10px;
  --font-display:'TT Ramillas','DB Helvethaica X',serif;
  --font-body:'DB Helvethaica X',system-ui,sans-serif;
  --font-num:'DB HelvethaicaMon X','DB Helvethaica X',sans-serif;
  --ease:cubic-bezier(.22,.61,.36,1);
}
/* ============ MIDNIGHT FOREST — DARK ============ */
[data-theme="dark"]{
  --cream:#0F1410; --cream-2:#161C17; --paper:rgba(26,33,27,.82);
  --ink:#ECEAE0; --ink-soft:#A9AE9E;
  --line:rgba(231,217,187,.10); --line-gold:rgba(194,163,105,.32);
  --shadow:0 22px 60px -20px rgba(0,0,0,.55);
  --gold-soft:#5d4f33;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:var(--font-body);background:var(--cream);color:var(--ink);
  -webkit-font-smoothing:antialiased;font-size:17px;line-height:1.5;
  transition:background .5s,color .5s;
}
::selection{background:var(--gold-soft)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit}
input,select{font-family:inherit;font-size:inherit;color:inherit}
.hidden{display:none!important}
.micro{font-size:12px;letter-spacing:.22em;text-transform:uppercase;font-weight:500;color:var(--gold-deep)}

/* ══════════════════════════════════════════════════════════
   BRAND MOTION BACKDROP — ใช้ Key Visual จริงของ Mersi Clinic
   ภาพจริง + Ken Burns ช้าๆ + แสงกวาด + ประกาย (นุ่ม ไม่รบกวนการอ่าน)
   ══════════════════════════════════════════════════════════ */
.bgArt{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:var(--cream)}

/* ชั้นภาพ KV — ซูม/เลื่อนช้ามากแบบ Ken Burns */
.kv{position:absolute;inset:0;
  background-image:url("assets/img/kv-bg.jpg");
  background-size:cover;background-position:center;
  will-change:transform;animation:kvPan 60s ease-in-out infinite alternate}
@keyframes kvPan{
  0%  {transform:scale(1.06) translate(0,0)}
  50% {transform:scale(1.11) translate(-1.1%,-.8%)}
  100%{transform:scale(1.07) translate(.9%,.7%)}}

/* ไล่แสงกลางภาพให้พื้นที่อ่านสว่างขึ้น + หายใจช้าๆ */
.kvCore{position:absolute;inset:0;
  background:radial-gradient(58% 52% at 50% 46%,rgba(253,251,240,.62) 0%,rgba(253,251,240,.28) 42%,rgba(253,251,240,0) 72%);
  animation:kvBreathe 24s ease-in-out infinite}
@keyframes kvBreathe{0%,100%{opacity:.75}50%{opacity:1}}

/* แสงกวาดเฉียงบางๆ */
.kvSheen{position:absolute;top:-30%;left:-60%;width:60%;height:170%;
  background:linear-gradient(100deg,transparent,rgba(255,255,248,.5),transparent);
  filter:blur(26px);animation:kvSheen 17s ease-in-out infinite}
@keyframes kvSheen{0%{transform:translateX(0) rotate(9deg);opacity:0}
  12%{opacity:.9} 70%{opacity:.55} 100%{transform:translateX(320%) rotate(9deg);opacity:0}}

/* ม่านโหมดมืด */
.kvVeil{position:absolute;inset:0;background:rgba(10,15,11,0);transition:background .6s}
[data-theme="dark"] .kvVeil{background:rgba(9,13,10,.9)}
[data-theme="dark"] .kv{filter:saturate(.55) brightness(.42) contrast(1.05)}
[data-theme="dark"] .kvCore{background:radial-gradient(58% 52% at 50% 46%,rgba(38,52,40,.55) 0%,rgba(38,52,40,0) 70%)}
[data-theme="dark"] .kvSheen{opacity:.25}

/* ประกายดาว 4 แฉก ให้เข้ากับ glint ในภาพ */
.spark{position:absolute;background:linear-gradient(#FFFEF8,#F6EDD4);
  clip-path:polygon(50% 0,56.5% 43.5%,100% 50%,56.5% 56.5%,50% 100%,43.5% 56.5%,0 50%,43.5% 43.5%);
  opacity:0;animation:mTwinkle 7s ease-in-out infinite}
[data-theme="dark"] .spark{background:linear-gradient(#E7D9BB,#C2A369);opacity:0}
@keyframes mTwinkle{0%,100%{opacity:0;transform:scale(.45) rotate(0deg)}
  42%{opacity:.95;transform:scale(1) rotate(20deg)}
  62%{opacity:.45;transform:scale(.88) rotate(32deg)}}

@media(max-width:760px){
  .kv{background-image:url("assets/img/kv-bg-sm.jpg")}
  .kvSheen{display:none}
}
@media(prefers-reduced-motion:reduce){
  .kv,.kvCore,.kvSheen,.spark{animation:none!important}
  .kv{transform:scale(1.04)}
}

/* ============ BRAND LOGO ============ */
.logoCircle{border-radius:50%;background:var(--sage);color:#FDFDFB;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;user-select:none}
.logoCircle .lm{font-family:var(--font-display);font-weight:500;line-height:1}
.logoCircle .lc{letter-spacing:.42em;text-indent:.42em;font-weight:400;opacity:.92}
.logoXL{width:112px;height:112px}.logoXL .lm{font-size:42px}.logoXL .lc{font-size:10px;margin-top:6px}
.logoSM{width:46px;height:46px}.logoSM .lm{font-size:19px}.logoSM .lc{display:none}
/* โลโก้จริง (assets/img/logo.png) — โปร่งใส คมชัด มีเงานุ่มให้ลอยจากพื้น */
img.logoImg{object-fit:contain;background:transparent;display:block;
  filter:drop-shadow(0 6px 18px rgba(27,35,29,.16))}
.loginCard img.logoImg{margin:0 auto 20px;animation:logoIn .9s var(--ease) both}
@keyframes logoIn{from{opacity:0;transform:scale(.9) translateY(8px)}to{opacity:1;transform:none}}
.sbBrand img.logoImg{filter:drop-shadow(0 3px 10px rgba(0,0,0,.4))}
@media(prefers-reduced-motion:reduce){.loginCard img.logoImg{animation:none}}

/* ============ LOGIN ============ */
/* โปร่งใส — ให้ Motion Backdrop (KV แบรนด์) แสดงเต็มจอหน้า login */
#loginView{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;z-index:50;
  background:transparent}
.loginCard{width:100%;max-width:410px;background:var(--paper);border:1px solid var(--line-gold);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:44px 42px 32px;text-align:center;animation:rise .7s var(--ease) both;backdrop-filter:blur(18px);position:relative;z-index:2}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.loginCard .logoCircle{margin:0 auto 20px}
.loginCard .hubLabel{font-family:var(--font-display);font-size:15px;letter-spacing:.34em;text-indent:.34em;text-transform:uppercase;color:var(--sage-deep);margin-bottom:6px}
.loginCard .sub{color:var(--ink-soft);font-size:15px;margin-bottom:26px}
.field{text-align:left;margin-bottom:16px}
.field label{display:block;font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:7px;font-weight:500}
.field input,.field select{width:100%;padding:12px 15px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--cream);font-size:17px;color:var(--ink);outline:none;transition:border-color .25s,box-shadow .25s}
.field input:focus,.field select:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(194,163,105,.15)}
.btnGold{width:100%;margin-top:8px;padding:13px;border-radius:var(--r-sm);background:linear-gradient(135deg,#CBAD74,var(--gold-deep));color:#fff;font-size:15.5px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;transition:transform .2s var(--ease),box-shadow .25s;box-shadow:0 10px 24px -10px rgba(168,137,79,.55)}
.btnGold:hover{transform:translateY(-1px)}
.loginErr{color:var(--danger);font-size:14.5px;margin-top:12px;min-height:20px}
.loginFoot{margin-top:20px;padding-top:16px;border-top:1px solid var(--line);font-size:13px;color:var(--ink-soft)}

/* ============ APP SHELL ============ */
#appView{display:flex;height:100vh;overflow:hidden;position:relative;z-index:2}
.sidebar{width:276px;flex-shrink:0;background:var(--forest);color:#E8E6DD;display:flex;flex-direction:column;position:relative;z-index:30;transition:transform .35s var(--ease)}
.sidebar::after{content:"";position:absolute;top:0;right:0;bottom:0;width:1px;background:linear-gradient(180deg,transparent,var(--line-gold),transparent)}
.sbBrand{padding:26px 24px 20px;display:flex;align-items:center;gap:13px}
.sbBrand .n{font-family:var(--font-display);font-size:23px;font-weight:500;color:#F3F1E8;line-height:1.1}
.sbBrand .t{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--sage);margin-top:3px}
.sbNav{flex:1;overflow-y:auto;padding:4px 14px 16px}
.sbNav::-webkit-scrollbar{width:4px}.sbNav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:2px}
.sbSection{margin-top:16px;padding:0 12px 8px;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--sage)}
.navItem{display:flex;align-items:center;gap:11px;width:100%;padding:10px 12px;border-radius:var(--r-sm);color:#CFCEC2;font-size:16px;text-align:left;transition:background .2s,color .2s;border:1px solid transparent}
.navItem .ic{width:20px;text-align:center;color:var(--sage);font-size:13px}
.navItem:hover{background:rgba(255,255,255,.05);color:#fff}
.navItem.active{background:rgba(194,163,105,.13);border-color:rgba(194,163,105,.28);color:#F3EAD6}
.navItem.active .ic{color:var(--gold)}
.navItem .cnt{margin-left:auto;font-size:13px;color:var(--sage);font-family:var(--font-num)}
.sbUser{padding:14px 18px 16px;border-top:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:11px}
.avatar{width:38px;height:38px;border-radius:50%;flex-shrink:0;background:linear-gradient(135deg,var(--gold),var(--gold-deep));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:500;font-size:17px}
.sbUser .un{font-size:15.5px;font-weight:500;color:#F0EEE4;line-height:1.2}
.sbUser .ur{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--sage)}
.logoutBtn{margin-left:auto;color:var(--sage);font-size:17px;padding:8px;border-radius:8px;transition:.2s}
.logoutBtn:hover{color:#E8B4A6;background:rgba(255,255,255,.06)}

.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{display:flex;align-items:center;gap:16px;padding:14px 30px;background:color-mix(in srgb,var(--cream) 82%,transparent);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);position:relative;z-index:20}
.burger{display:none;font-size:20px;padding:6px 10px;border-radius:8px}
.greet .g1{font-family:var(--font-display);font-size:22px;font-weight:500;line-height:1.2}
.greet .g2{font-size:14px;color:var(--ink-soft)}
.searchBtn{margin-left:auto;display:flex;align-items:center;gap:10px;width:min(320px,32vw);padding:10px 14px;border-radius:99px;border:1px solid var(--line);background:var(--paper);color:var(--ink-soft);font-size:15px;transition:border-color .25s}
.searchBtn:hover{border-color:var(--gold)}
.searchBtn .kbd{margin-left:auto;font-size:11px;border:1px solid var(--line);border-radius:6px;padding:2px 7px;background:var(--cream)}
.iconBtn{font-size:17px;padding:9px 12px;border-radius:99px;border:1px solid var(--line);background:var(--paper);transition:.25s}
.iconBtn:hover{border-color:var(--gold);color:var(--gold-deep)}
.clock{text-align:right;line-height:1.25}
.clock .c1{font-family:var(--font-num);font-size:20px;font-weight:500}
.clock .c2{font-size:12px;color:var(--ink-soft);letter-spacing:.06em}

.content{flex:1;overflow-y:auto;padding:28px 36px 60px;scroll-behavior:smooth}
.content::-webkit-scrollbar{width:8px}.content::-webkit-scrollbar-thumb{background:rgba(127,127,110,.25);border-radius:4px}

/* ---- Announcement ---- */
.announce{display:flex;align-items:center;gap:12px;padding:13px 18px;border-radius:var(--r-md);margin-bottom:22px;background:var(--paper);border:1px solid var(--line-gold);position:relative;overflow:hidden;animation:rise .5s var(--ease) both}
.announce::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,var(--gold),var(--gold-deep))}
.announce.warn::before{background:var(--warn)}
.announce .ax{margin-left:auto;color:var(--ink-soft);padding:4px 8px;border-radius:6px}
.announce .ax:hover{color:var(--danger)}

/* ---- Hero + stats ---- */
.hero{margin-bottom:26px}
.hero h2{font-family:var(--font-display);font-size:42px;font-weight:500;line-height:1.12;margin-top:8px}
.hero h2 em{font-style:italic;color:var(--gold-deep)}
.hero p{color:var(--ink-soft);margin-top:8px;max-width:600px;font-size:16px}
.statRow{display:flex;gap:14px;flex-wrap:wrap;margin-top:18px}
.statChip{display:flex;align-items:baseline;gap:9px;padding:12px 20px;border-radius:var(--r-md);background:var(--paper);border:1px solid var(--line);backdrop-filter:blur(10px)}
.statChip .v{font-family:var(--font-num);font-size:26px;font-weight:500;color:var(--gold-deep)}
.statChip .l{font-size:13px;color:var(--ink-soft)}
.modeChip{display:flex;align-items:center;gap:8px;padding:12px 20px;border-radius:var(--r-md);background:var(--paper);border:1px solid var(--line);font-size:13.5px;color:var(--ink-soft)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pulse 2s infinite}
.dot.off{background:#9aa08e;animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(76,133,88,.45)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}

.sectionHead{display:flex;align-items:baseline;gap:14px;margin:32px 0 16px}
.sectionHead h3{font-family:var(--font-display);font-size:25px;font-weight:500}
.sectionHead .rule{flex:1;height:1px;background:linear-gradient(90deg,var(--line-gold),transparent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}

/* ---- Card ---- */
.card{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px 22px 16px;text-align:left;transition:transform .3s var(--ease),box-shadow .3s,border-color .3s;overflow:hidden;display:flex;flex-direction:column;gap:10px;cursor:pointer;backdrop-filter:blur(10px);animation:cardIn .55s var(--ease) both;animation-delay:calc(var(--i,0)*45ms)}
@keyframes cardIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.card::before{content:"";position:absolute;top:0;left:22px;right:22px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:0;transition:opacity .3s}
.card:hover{transform:translateY(-4px);box-shadow:var(--shadow);border-color:var(--line-gold)}
.card:hover::before{opacity:.8}
.cardTop{display:flex;align-items:flex-start;gap:14px}
.medal{width:46px;height:46px;border-radius:50%;flex-shrink:0;border:1px solid var(--line-gold);background:var(--cream);display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--gold-deep);font-family:var(--font-display);transition:transform .3s var(--ease)}
.card:hover .medal{transform:scale(1.08) rotate(-6deg)}
.cardTop .tt{font-size:19px;font-weight:500;line-height:1.25;padding-right:26px}
.cardTop .cat{font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-soft);margin-top:3px;display:flex;align-items:center;gap:7px}
.card .desc{font-size:15px;color:var(--ink-soft);line-height:1.55;flex:1}
.cardFoot{display:flex;align-items:center;gap:8px;padding-top:11px;border-top:1px solid var(--line)}
.chip{font-size:12.5px;padding:2px 10px;border-radius:99px;background:var(--cream-2);color:var(--ink-soft)}
.openHint{margin-left:auto;font-size:13.5px;color:var(--gold-deep);font-weight:500;white-space:nowrap}
.starBtn{position:absolute;top:12px;right:12px;font-size:17px;color:#C9C5B6;padding:7px;border-radius:8px;transition:.2s;z-index:2}
.starBtn:hover{transform:scale(1.15)}
.starBtn.faved{color:var(--gold)}
.emptyNote{border:1px dashed var(--line-gold);border-radius:var(--r-md);padding:26px;text-align:center;color:var(--ink-soft);font-size:15px}

/* ---- Viewer ---- */
#viewer{display:flex;flex-direction:column;flex:1;min-height:0}
.vBar{display:flex;align-items:center;gap:12px;padding:11px 22px;background:var(--paper);border-bottom:1px solid var(--line);flex-wrap:wrap;backdrop-filter:blur(14px)}
.vBtn{display:flex;align-items:center;gap:7px;font-size:14.5px;font-weight:500;padding:8px 14px;border-radius:var(--r-sm);border:1px solid var(--line);color:var(--ink-soft);transition:.2s;background:var(--cream);white-space:nowrap}
.vBtn:hover{border-color:var(--gold);color:var(--gold-deep)}
.vTitle{font-family:var(--font-display);font-size:22px;font-weight:500;margin-left:6px;line-height:1.15}
.vMeta{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);display:flex;align-items:center;gap:8px}
.vActions{margin-left:auto;display:flex;gap:8px}
.vFrameWrap{flex:1;position:relative;background:var(--cream-2)}
#vFrame{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;opacity:0;transition:opacity .5s}
#vFrame.on{opacity:1}
.vLoad{position:absolute;inset:0;display:flex;flex-direction:column;gap:16px;align-items:center;justify-content:center;background:var(--cream-2);transition:opacity .4s;color:var(--ink-soft);font-size:14px;letter-spacing:.12em}
.spinner{width:38px;height:38px;border-radius:50%;border:2px solid var(--gold-soft);border-top-color:var(--gold-deep);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ชิปรหัสปัจจุบัน */
.pwChip{font-family:var(--font-num);font-size:14px;letter-spacing:.02em;
  padding:4px 10px;border-radius:8px;border:1px dashed var(--line-gold);
  background:color-mix(in srgb,var(--gold-soft) 34%,transparent);color:var(--ink);
  cursor:pointer;transition:.2s;white-space:nowrap}
.pwChip:hover{border-style:solid;border-color:var(--gold);background:color-mix(in srgb,var(--gold-soft) 55%,transparent)}
.pwChip.ok{border-color:var(--ok);color:var(--ok)}
.pwCopy{opacity:.5;margin-left:2px}

/* ---- Admin ---- */
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-lg);padding:24px;margin-bottom:20px;backdrop-filter:blur(10px);animation:cardIn .5s var(--ease) both}
.panel h4{font-family:var(--font-display);font-size:21px;font-weight:500;margin-bottom:4px}
.panel .ps{font-size:13.5px;color:var(--ink-soft);margin-bottom:16px}
.formRow{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.formRow .field{flex:1;min-width:150px;margin-bottom:0}
.btnMini{padding:10px 18px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--cream);font-size:14.5px;font-weight:500;transition:.2s;white-space:nowrap}
.btnMini:hover{border-color:var(--gold);color:var(--gold-deep)}
.btnMini.primary{background:linear-gradient(135deg,#CBAD74,var(--gold-deep));color:#fff;border-color:transparent}
.btnMini.danger:hover{border-color:var(--danger);color:var(--danger)}
table.tbl{width:100%;border-collapse:collapse;font-size:15px;margin-top:6px}
.tbl th{text-align:left;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);padding:9px 10px;border-bottom:1px solid var(--line-gold);font-weight:500}
.tbl td{padding:10px;border-bottom:1px solid var(--line)}
.roleChip{font-size:12px;padding:2px 10px;border-radius:99px;background:var(--cream-2);letter-spacing:.06em}
.roleChip.admin{background:var(--gold-soft);color:var(--ink)}
.stChip{font-size:12.5px;font-weight:600}
.stChip.on{color:var(--ok)}.stChip.off{color:var(--danger)}
.barRow{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:14px}
.barRow .n{width:180px;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.barTrack{flex:1;height:8px;background:var(--cream-2);border-radius:4px;overflow:hidden}
.barFill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-deep));border-radius:4px;transition:width .8s var(--ease)}

/* ---- Command palette ---- */
#palWrap{position:fixed;inset:0;background:rgba(15,20,16,.45);backdrop-filter:blur(6px);z-index:80;display:flex;align-items:flex-start;justify-content:center;padding:12vh 18px 0;opacity:0;pointer-events:none;transition:opacity .25s}
#palWrap.open{opacity:1;pointer-events:auto}
.pal{width:min(560px,100%);background:var(--paper);border:1px solid var(--line-gold);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden;transform:translateY(-8px);transition:transform .25s var(--ease)}
#palWrap.open .pal{transform:none}
#palInput{width:100%;padding:17px 20px;border:0;outline:none;background:transparent;font-size:18px;color:var(--ink);border-bottom:1px solid var(--line)}
#palList{max-height:46vh;overflow-y:auto;padding:8px}
.palItem{display:flex;align-items:center;gap:13px;width:100%;padding:11px 13px;border-radius:var(--r-sm);text-align:left;transition:background .15s}
.palItem .medal{width:36px;height:36px;font-size:14px}
.palItem .t{font-size:16px;font-weight:500}
.palItem .c{font-size:12px;color:var(--ink-soft);letter-spacing:.1em;text-transform:uppercase}
.palItem.sel,.palItem:hover{background:var(--cream-2)}
.palItem .go{margin-left:auto;font-size:12px;color:var(--gold-deep)}
.palFoot{padding:9px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-soft);display:flex;gap:16px}

#toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--forest);color:#F0EEE4;padding:12px 22px;border-radius:99px;font-size:15px;box-shadow:var(--shadow);opacity:0;transition:all .4s var(--ease);z-index:99;border:1px solid rgba(194,163,105,.4);pointer-events:none;max-width:88vw}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.scrim{display:none}
@media(max-width:920px){
  .sidebar{position:fixed;top:0;bottom:0;left:0;transform:translateX(-100%)}
  .sidebar.open{transform:none;box-shadow:var(--shadow)}
  .scrim{display:block;position:fixed;inset:0;background:rgba(15,20,16,.45);opacity:0;pointer-events:none;transition:opacity .3s;z-index:25}
  .scrim.show{opacity:1;pointer-events:auto}
  .burger{display:block}
  .clock{display:none}
  .topbar{padding:12px 16px;flex-wrap:wrap}
  .content{padding:20px 16px 50px}
  .hero h2{font-size:31px}
  .searchBtn{width:auto;flex:1}
  .searchBtn .kbd{display:none}
  .vActions{margin-left:0;width:100%;justify-content:flex-end}
  .barRow .n{width:110px}
}

/* ══════════════════════════════════════════════════════════
   HI-TECH LAYER v3 — glass · lattice · glow · mono · motion
   (คงโทนแบรนด์ ครีม/ทอง/เซจ — เพิ่มความเนี้ยบแบบ command-center)
   ══════════════════════════════════════════════════════════ */
:root{
  --font-num:'DB HelvethaicaMon X',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
  --glow-gold:rgba(194,163,105,.55);
  --glass:color-mix(in srgb,var(--paper) 72%,transparent);
  --glass-strong:color-mix(in srgb,var(--paper) 86%,transparent);
  --hair:color-mix(in srgb,var(--gold) 22%,transparent);
}
[data-theme="dark"]{ --glass:color-mix(in srgb,var(--paper) 60%,transparent); }

/* ---- faint lattice grid over the whole app ---- */
.mesh{position:absolute;inset:0;pointer-events:none;z-index:1;opacity:.26;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:46px 46px;
  -webkit-mask-image:radial-gradient(120% 90% at 50% -10%,#000 18%,transparent 66%);
          mask-image:radial-gradient(120% 90% at 50% -10%,#000 18%,transparent 66%)}
[data-theme="dark"] .mesh{opacity:.4}

/* ---- glassy surfaces (translucent fill; blur reserved for low-count chrome) ---- */
.statChip,.modeChip,.card,.panel,.announce{background:var(--glass)}
.searchBtn,.iconBtn,.vBar,.loginCard,.pal,.clock{
  background:var(--glass);backdrop-filter:blur(16px) saturate(1.12);-webkit-backdrop-filter:blur(16px) saturate(1.12)}
.topbar{background:color-mix(in srgb,var(--cream) 72%,transparent);backdrop-filter:blur(16px) saturate(1.08);-webkit-backdrop-filter:blur(16px) saturate(1.08)}

/* ---- mono/technical type for numbers & labels ---- */
.statChip .v,.clock .c1,.card .cnt,.navItem .cnt,.barRow span:last-child,.roleChip,.stChip{
  font-family:var(--font-num);font-feature-settings:"tnum" 1;letter-spacing:.01em}
.micro,.vMeta,.field label,.tbl th,.cardTop .cat{font-feature-settings:"tnum" 1}
.statChip .l{font-family:var(--font-num);font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.8}

/* ---- data-panel cards: hairline ring, corner tick, glow ---- */
.card{border-color:var(--hair)}
.card::after{content:"";position:absolute;top:11px;left:11px;width:13px;height:13px;pointer-events:none;
  border-top:1.5px solid var(--line-gold);border-left:1.5px solid var(--line-gold);border-top-left-radius:5px;
  opacity:.65;transition:opacity .3s,border-color .3s,filter .3s}
.card:hover{box-shadow:var(--shadow),0 0 0 1px var(--line-gold),0 0 32px -14px var(--glow-gold)}
.card:hover::after{opacity:1;border-color:var(--gold);filter:drop-shadow(0 0 5px var(--glow-gold))}
.card:active{transform:translateY(-2px) scale(.995)}
.medal{background:linear-gradient(150deg,var(--cream),color-mix(in srgb,var(--gold-soft) 60%,var(--cream)));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}

/* ---- stat chips: technical readout ---- */
.statChip{position:relative;padding-top:16px;overflow:hidden}
.statChip::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.55}
.statChip .v{font-size:27px;letter-spacing:-.01em}
.modeChip{position:relative;padding-top:16px}

/* ---- topbar clock: framed HUD ---- */
.clock{padding:6px 14px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--glass);position:relative}
.clock .c2{font-family:var(--font-num);letter-spacing:.1em;text-transform:uppercase;font-size:10.5px;opacity:.75}
.searchBtn .kbd{font-family:var(--font-num)}

/* ---- sidebar: subtle lattice + active glow ---- */
.sidebar{background:
  linear-gradient(180deg,color-mix(in srgb,var(--forest) 92%,#000) 0%,var(--forest) 40%),
  var(--forest)}
.sidebar .sbNav{background-image:linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px);background-size:100% 42px}
.navItem{position:relative}
.navItem.active{box-shadow:inset 0 0 22px -8px var(--glow-gold)}
.navItem.active::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:2px;border-radius:2px;
  background:linear-gradient(180deg,var(--gold),var(--gold-deep));box-shadow:0 0 10px var(--glow-gold)}
.sbBrand .n{letter-spacing:.01em}
.sbSection{font-family:var(--font-num)}

/* ---- login: HUD frame ---- */
.loginCard::before{content:"";position:absolute;inset:0;border-radius:var(--r-lg);pointer-events:none;
  background:linear-gradient(135deg,var(--line-gold),transparent 40%,transparent 60%,var(--line-gold));
  -webkit-mask:linear-gradient(#000,#000) content-box,linear-gradient(#000,#000);
  -webkit-mask-composite:xor;mask-composite:exclude;padding:1px;opacity:.7}
.hubLabel{font-family:var(--font-num)}

/* ---- viewer: technical toolbar ---- */
.vBar{border-bottom-color:var(--line-gold)}
.vMeta{font-family:var(--font-num)}
.vFrameWrap{background:
  radial-gradient(60% 60% at 50% 40%,color-mix(in srgb,var(--sage) 8%,transparent),transparent 70%),
  linear-gradient(var(--line) 1px,transparent 1px) 0 0/46px 46px,
  linear-gradient(90deg,var(--line) 1px,transparent 1px) 0 0/46px 46px,var(--cream-2)}

/* ---- section header: technical marker ---- */
.sectionHead h3{letter-spacing:.005em}
.sectionHead::before{content:"";width:7px;height:7px;border:1.5px solid var(--gold-deep);border-radius:2px;
  transform:rotate(45deg);flex-shrink:0;opacity:.8}

/* ---- command palette mono ---- */
.palItem .c,.palFoot{font-family:var(--font-num)}

/* ---- smooth view transition ---- */
#homeView:not(.hidden),#viewer:not(.hidden){animation:viewIn .45s var(--ease) both}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ══════════════ RESPONSIVE — Desktop / Tablet / Mobile ══════════════ */
/* — Laptop/narrow desktop — */
@media(max-width:1240px){
  .sidebar{width:246px}
  .content{padding:26px 30px 56px}
  .hero h2{font-size:37px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
}
/* — Tablet — */
@media(max-width:920px){
  .greet .g1{font-size:19px}
  .searchBtn{order:5;flex-basis:100%;width:100%;margin-left:0}
  .searchBtn .kbd{display:inline-block}
  .statChip{flex:1;min-width:calc(50% - 7px)}
  .modeChip{flex-basis:100%}
  .vBar{padding:10px 16px}
  .vTitle{font-size:19px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
}
/* — Mobile — */
@media(max-width:600px){
  body{font-size:16px}
  .topbar{padding:10px 14px;gap:10px}
  .greet .g1{font-size:17px}.greet .g2{font-size:12.5px}
  .clock{display:none}
  .iconBtn{padding:8px 11px}
  .content{padding:16px 14px 46px}
  .hero h2{font-size:27px;line-height:1.15}
  .hero p{font-size:14.5px}
  .statRow{gap:10px}
  .statChip{min-width:calc(50% - 5px);padding:12px 14px 14px}
  .statChip .v{font-size:22px}
  .grid{grid-template-columns:1fr;gap:14px}
  .sectionHead{margin:24px 0 12px}
  .sectionHead h3{font-size:21px}
  .card{padding:18px 18px 14px}
  .cardTop .tt{font-size:18px}
  .loginCard{padding:34px 24px 26px}
  .vBar{gap:8px}
  .vBtn{padding:8px 11px;font-size:13.5px}
  .vActions{gap:6px}
  .pal{width:100%}
  #palWrap{padding:8vh 12px 0}
  .announce{font-size:14.5px;padding:12px 14px}
  .panel{padding:18px 16px}
  .formRow .field{min-width:100%}
  .tbl{font-size:14px}
  .tbl td,.tbl th{padding:8px 6px}
}
/* — very small — */
@media(max-width:380px){
  .statChip{min-width:100%}
  .hero h2{font-size:24px}
}

/* ══════════════════════════════════════════════════════════
   IT CONSOLE v4 — tabs · modal form · data tables
   ══════════════════════════════════════════════════════════ */
.tabBar{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 20px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.tabBtn{display:flex;align-items:center;gap:8px;padding:9px 16px;border-radius:99px;border:1px solid var(--line);
  background:var(--glass);font-size:14.5px;font-weight:500;color:var(--ink-soft);transition:.2s var(--ease);white-space:nowrap}
.tabBtn:hover{border-color:var(--gold);color:var(--gold-deep);transform:translateY(-1px)}
.tabBtn.on{background:linear-gradient(135deg,#CBAD74,var(--gold-deep));color:#fff;border-color:transparent;
  box-shadow:0 8px 20px -10px rgba(168,137,79,.6)}

.pHead{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.pHead h4{margin-bottom:2px}
.pHead .ps{margin-bottom:0;max-width:640px}
.pAct{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.miniSearch{padding:9px 14px;border-radius:99px;border:1px solid var(--line);background:var(--cream);
  font-size:14.5px;min-width:170px;outline:none;transition:.2s}
.miniSearch:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(194,163,105,.15)}

.tblWrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl tr:hover td{background:color-mix(in srgb,var(--gold-soft) 18%,transparent)}
.tbl td.actCell{text-align:right;white-space:nowrap}
.tbl td.actCell .btnMini{padding:6px 11px;font-size:13.5px;margin-left:5px}
.roleChip.it{background:color-mix(in srgb,var(--sage) 42%,var(--cream-2));color:var(--ink)}
.tagMini{font-size:11.5px;padding:1px 8px;border-radius:99px;background:var(--cream-2);color:var(--ink-soft);margin-right:4px;white-space:nowrap}
.ordBtn{padding:3px 8px;border-radius:6px;border:1px solid var(--line);color:var(--ink-soft);font-size:13px;line-height:1.4}
.ordBtn:hover{border-color:var(--gold);color:var(--gold-deep)}
.badgeOn{font-family:var(--font-num);font-size:12px;padding:2px 9px;border-radius:99px;background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.badgeOff{font-family:var(--font-num);font-size:12px;padding:2px 9px;border-radius:99px;background:color-mix(in srgb,var(--danger) 15%,transparent);color:var(--danger)}
.hintBox{border:1px dashed var(--line-gold);border-radius:var(--r-md);padding:14px 16px;font-size:14px;color:var(--ink-soft);line-height:1.65;margin-top:12px}
.hintBox b{color:var(--ink)}
.hintBox code{font-family:var(--font-num);font-size:13px;background:var(--cream-2);padding:1px 6px;border-radius:5px}

/* ---- modal ---- */
#mdWrap{position:fixed;inset:0;background:rgba(15,20,16,.5);backdrop-filter:blur(7px);z-index:90;
  display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px 4vh;overflow-y:auto;
  opacity:0;pointer-events:none;transition:opacity .25s}
#mdWrap.open{opacity:1;pointer-events:auto}
.md{width:min(620px,100%);background:var(--paper);border:1px solid var(--line-gold);border-radius:var(--r-lg);
  box-shadow:var(--shadow);overflow:hidden;transform:translateY(-10px) scale(.985);transition:transform .28s var(--ease);
  backdrop-filter:blur(18px);margin:auto}
#mdWrap.open .md{transform:none}
.mdHead{display:flex;align-items:flex-start;gap:12px;padding:20px 24px 15px;border-bottom:1px solid var(--line)}
.mdTitle{font-family:var(--font-display);font-size:22px;font-weight:500;line-height:1.2}
.mdSub{font-size:13.5px;color:var(--ink-soft);margin-top:3px}
.mdX{margin-left:auto;font-size:18px;color:var(--ink-soft);padding:6px 10px;border-radius:8px;transition:.2s}
.mdX:hover{color:var(--danger);background:var(--cream-2)}
.mdBody{padding:20px 24px 6px;max-height:62vh;overflow-y:auto}
.mdBody .field{margin-bottom:15px}
.mdBody textarea{width:100%;padding:12px 15px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--cream);
  font-family:inherit;font-size:16.5px;color:var(--ink);outline:none;resize:vertical;min-height:76px;transition:.2s}
.mdBody textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(194,163,105,.15)}
.mdRow{display:flex;gap:12px;flex-wrap:wrap}
.mdRow .field{flex:1;min-width:150px}
.fHint{font-size:12.5px;color:var(--ink-soft);margin-top:5px;line-height:1.45}
.mdChk{display:flex;align-items:center;gap:9px;font-size:15px;padding:8px 12px;border:1px solid var(--line);
  border-radius:var(--r-sm);background:var(--cream);cursor:pointer;transition:.2s;user-select:none}
.mdChk:hover{border-color:var(--gold)}
.mdChk input{width:17px;height:17px;accent-color:var(--gold-deep);cursor:pointer}
.chkGrid{display:flex;gap:9px;flex-wrap:wrap}
.mdFoot{display:flex;gap:10px;justify-content:flex-end;padding:15px 24px 20px;border-top:1px solid var(--line);
  background:color-mix(in srgb,var(--cream-2) 55%,transparent)}
.mdErr{color:var(--danger);font-size:14px;margin-right:auto;align-self:center;text-align:left}
@media(max-width:1340px){
  #admBody .tbl{font-size:14px}
  #admBody .tbl td,#admBody .tbl th{padding:8px 7px}
  #admBody .tbl td.actCell .btnMini{padding:5px 9px;font-size:13px;margin-left:4px}
}
/* — มือถือ: แปลงตารางเป็นการ์ดอ่านง่าย — */
@media(max-width:620px){
  #admBody .tbl,#admBody .tbl tbody,#admBody .tbl tr,#admBody .tbl td{display:block;width:100%}
  #admBody .tbl tr:has(th){display:none}
  #admBody .tbl tr{border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;margin-bottom:10px;background:var(--cream)}
  #admBody .tbl td{border:0;padding:3px 0}
  #admBody .tbl tr:hover td{background:transparent}
  #admBody .tbl td.actCell{display:flex;flex-wrap:wrap;gap:6px;text-align:left;
    margin-top:9px;padding-top:10px;border-top:1px solid var(--line)}
  #admBody .tbl td.actCell .btnMini{margin-left:0;flex:1 1 auto;min-width:84px;text-align:center}
  #admBody .tblWrap{overflow-x:visible}
}
@media(max-width:600px){
  .mdBody{max-height:54vh;padding:16px 16px 4px}
  .mdHead,.mdFoot{padding-left:16px;padding-right:16px}
  .tabBtn{padding:8px 13px;font-size:13.5px}
  .pAct{width:100%;margin-left:0}
  .miniSearch{flex:1;min-width:0}
}
</style>
</head>

    <div class="sbBrand"><div id="sbLogo"></div><div><div class="n" id="sbName"></div><div class="t" id="sbSub"></div></div></div>

    dashboards:[{id:"demo",title:"ตัวอย่าง Dashboard",category:"sales",icon:"◇",desc:"วางไฟล์ dashboards.config.js ไว้โฟลเดอร์เดียวกับ index.html เพื่อใช้ข้อมูลจริง",tags:["demo"],roles:["marketing","area"],url:"about:blank"}],
    users:[{username:"admin",displayName:"ผู้ดูแลระบบ",role:"admin",passwordHash:"03ac674216f3e15c761ee1a5e255f067953623c8b388b4459e13f978d7c846f4"}]
  };

const SESSION_KEY = "mersi_hub_session";

let palSel = 0;

/* ============================================================
   ROLES & PERMISSIONS (แก้ได้จากหน้าเว็บ — ไม่ต้องแตะโค้ด)
   manage  = เข้าศูนย์ควบคุมระบบ / เพิ่ม-แก้ผู้ใช้ dashboard หมวดหมู่ ฯลฯ
   allDash = เห็นทุก dashboard โดยไม่ต้องระบุสิทธิ์รายตัว
   ============================================================ */
const DEFAULT_ROLES = [
  { id:"admin",     label:"ผู้ดูแลระบบ (Admin)",     manage:true,  allDash:true  },
  { id:"it",        label:"ฝ่าย IT (IT Support)",     manage:true,  allDash:true  },

  { id:"area",      label:"ผู้จัดการเขต (Area)",      manage:false, allDash:false },
];
/* localStorage override keys — โหมดในเครื่อง (ยังไม่เชื่อม Sheet) */
const LS = {
  users:"mersi_hub_localusers", dash:"mersi_hub_localdash",
  cats:"mersi_hub_localcats",   roles:"mersi_hub_localroles",
};
function lsGet(k){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):null; }catch(e){ return null } }
function lsSet(k,v){ localStorage.setItem(k, JSON.stringify(v)); }

function baseRoles(){
  const cfg = Array.isArray(CFG.roles) && CFG.roles.length ? CFG.roles : DEFAULT_ROLES;
  /* การันตีว่ามี admin/it เสมอ กันล็อกตัวเองออกจากระบบ */
  const out = cfg.map(r=>({ id:r.id, label:r.label||r.id, manage:!!r.manage, allDash:!!r.allDash }));
  DEFAULT_ROLES.slice(0,2).forEach(d=>{ if(!out.some(r=>r.id===d.id)) out.push({...d}); });
  return out;
}
let RUNTIME = {
  categories: lsGet(LS.cats) || CFG.categories || [],
  dashboards: lsGet(LS.dash) || CFG.dashboards || [],

};
function roleDef(id){

}
function roleLabel(id){ const r=roleDef(id); return r.label||id; }
/* admin ได้สิทธิ์เต็มตลอด กัน config เพี้ยนแล้วเข้าระบบไม่ได้ */

function canSeeAll(){ return !!session && (session.role==="admin" || roleDef(session.role).allDash===true); }
function viewRoles(){ return (RUNTIME.roles||[]).filter(r=>!r.allDash); }

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
async function sha256(str){
  try{
    if(crypto&&crypto.subtle){
      const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
      return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("");
    }
  }catch(e){}
  return sha256js(str); // fallback สำหรับ file:// หรือ non-HTTPS ที่ไม่มี crypto.subtle
}
/* pure-JS SHA-256 (ผลลัพธ์ hex ตรงกับ crypto.subtle) */
function sha256js(ascii){
  function rr(n,x){return (x>>>n)|(x<<(32-n));}
  const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  let h=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const bytes=[]; for(let i=0;i<ascii.length;i++){let c=ascii.charCodeAt(i);
    if(c<128)bytes.push(c);else if(c<2048){bytes.push(192|(c>>6),128|(c&63));}
    else if(c<55296||c>=57344){bytes.push(224|(c>>12),128|((c>>6)&63),128|(c&63));}
    else{i++;c=0x10000+(((c&1023)<<10)|(ascii.charCodeAt(i)&1023));bytes.push(240|(c>>18),128|((c>>12)&63),128|((c>>6)&63),128|(c&63));}}
  const l=bytes.length*8; bytes.push(0x80); while(bytes.length%64!==56)bytes.push(0);
  for(let i=7;i>=0;i--)bytes.push((l/Math.pow(2,i*8))&0xff);
  const w=new Int32Array(64);
  for(let j=0;j<bytes.length;j+=64){
    for(let i=0;i<16;i++)w[i]=(bytes[j+i*4]<<24)|(bytes[j+i*4+1]<<16)|(bytes[j+i*4+2]<<8)|bytes[j+i*4+3];
    for(let i=16;i<64;i++){const s0=rr(7,w[i-15])^rr(18,w[i-15])^(w[i-15]>>>3),s1=rr(17,w[i-2])^rr(19,w[i-2])^(w[i-2]>>>10);w[i]=(w[i-16]+s0+w[i-7]+s1)|0;}
    let[a,b,c,d,e,f,g,hh]=h;
    for(let i=0;i<64;i++){const S1=rr(6,e)^rr(11,e)^rr(25,e),ch=(e&f)^(~e&g),t1=(hh+S1+ch+K[i]+w[i])|0,S0=rr(2,a)^rr(13,a)^rr(22,a),mj=(a&b)^(a&c)^(b&c),t2=(S0+mj)|0;hh=g;g=f;f=e;e=(d+t1)|0;d=c;c=b;b=a;a=(t1+t2)|0;}
    h[0]=(h[0]+a)|0;h[1]=(h[1]+b)|0;h[2]=(h[2]+c)|0;h[3]=(h[3]+d)|0;h[4]=(h[4]+e)|0;h[5]=(h[5]+f)|0;h[6]=(h[6]+g)|0;h[7]=(h[7]+hh)|0;
  }
  return h.map(x=>(x>>>0).toString(16).padStart(8,"0")).join("");
}
function toast(msg){
  const t=$("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2800);
}
function esc(s){const d=document.createElement("div");d.textContent=s??"";
  return d.innerHTML.replace(/"/g,"&quot;").replace(/'/g,"&#39;")}
function store(key, val){
  const k = `mersi_hub_${key}_${session?.username||"x"}`;
  if(val===undefined) return JSON.parse(localStorage.getItem(k)||"[]");
  localStorage.setItem(k, JSON.stringify(val));
}
function logoHTML(size){
  const px = size==="XL" ? 112 : 46;
  if(CFG.brand.logo) return `<img class="logoImg" src="${esc(CFG.brand.logo)}" width="${px}" height="${px}" alt="logo">`;
  return `<div class="logoCircle logo${size}"><span class="lm">Mersi</span><span class="lc">CLINIC</span></div>`;
}

/* ---------- theme ---------- */
function applyTheme(t){
  document.documentElement.dataset.theme = t;
  localStorage.setItem("mersi_hub_theme", t);
  const b=$("themeBtn"); if(b) b.textContent = t==="dark" ? "☀" : "☾";
}
function toggleTheme(){ applyTheme(document.documentElement.dataset.theme==="dark"?"light":"dark"); }

/* ---------- Google Sheet API ---------- */
function apiUrl(){ return localStorage.getItem("mersi_hub_api") || (CFG.api && CFG.api.url) || ""; }
async function api(action, data){
  const url = apiUrl();
  if(!url) return { ok:false, error:"NO_API" };
  try{
    const ctl = new AbortController();
    const to = setTimeout(()=>ctl.abort(), 10000);
    const r = await fetch(url, {
      method:"POST", signal:ctl.signal,
      headers:{ "Content-Type":"text/plain;charset=utf-8" },
      body: JSON.stringify({ action, token: session?.token, data: data||{} }),
    });
    clearTimeout(to);
    const j = await r.json();
    if(!j.ok && j.error==="TOKEN_EXPIRED"){ toast("เซสชันหมดอายุ — เข้าสู่ระบบใหม่"); setTimeout(logout, 1200); }
    return j;
  }catch(e){ return { ok:false, error:"NETWORK" }; }
}

/* ---------- auth / ผู้ใช้โหมดในเครื่อง ----------
   overlay = รายการที่ IT แก้ในเครื่องนี้ (ทับค่าใน dashboards.config.js)
   deleted:true = tombstone สำหรับผู้ใช้ที่มาจาก config แล้วถูกลบ            */
function localUsers(){ return lsGet(LS.users) || []; }
function saveLocalUsers(u){ lsSet(LS.users, u); }
function allLocalUsers(){
  const extra = localUsers();
  const key = s => String(s||"").toLowerCase();
  const merged = (CFG.users||[]).map(u=>{
    const ov = extra.find(x=>key(x.username)===key(u.username));
    return ov ? { ...u, ...ov } : u;
  });
  extra.forEach(x=>{ if(!merged.some(u=>key(u.username)===key(x.username))) merged.push(x); });
  return merged.filter(u=>!u.deleted);
}
function upsertLocalUser(username, patch){
  const key = s => String(s||"").toLowerCase();
  const ex = localUsers();
  const i = ex.findIndex(x=>key(x.username)===key(username));
  if(i>=0){ ex[i] = { ...ex[i], ...patch }; }
  else {
    const base = (CFG.users||[]).find(u=>key(u.username)===key(username)) || { username };
    ex.push({ ...base, ...patch });
  }
  saveLocalUsers(ex);
}
function loadSession(){
  try{ const s = JSON.parse(localStorage.getItem(SESSION_KEY)); if(s && s.exp > Date.now()) return s; }catch(e){}
  localStorage.removeItem(SESSION_KEY); return null;
}
$("loginForm").addEventListener("submit", async e=>{
  e.preventDefault();
  const btn=$("loginBtn"); btn.textContent="กำลังตรวจสอบ…";
  try{
  const u=$("inUser").value.trim(), hash=await sha256($("inPass").value);
  let done=false;
  if(apiUrl()){
    const r = await api("login", { username:u, hash });
    if(r.ok){ startSession({ ...r.user, token:r.token, mode:"api" }); done=true; }
    else if(r.error==="INVALID_LOGIN"){ $("loginErr").textContent="ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง"; }
    else { toast("เชื่อม Google Sheet ไม่ได้ — ใช้โหมดในเครื่องแทน"); }
  }
  if(!done && !$("loginErr").textContent){
    const user = allLocalUsers().find(x=>x.username.toLowerCase()===u.toLowerCase() && x.passwordHash===hash && x.active!==false);
    if(user) startSession({ username:user.username, displayName:user.displayName, role:user.role, mode:"local" });
    else $("loginErr").textContent="ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง";
  }
  }catch(err){ $("loginErr").textContent="เกิดข้อผิดพลาด: "+(err&&err.message||err); }
  btn.textContent="เข้าสู่ระบบ";
  $("inPass").value="";
  setTimeout(()=>$("loginErr").textContent="",3000);
});
function startSession(s){
  session = { ...s, exp: Date.now()+SESSION_HOURS*3600*1000 };
  localStorage.setItem(SESSION_KEY, JSON.stringify(session));
  enterApp();
}
function logout(){ localStorage.removeItem(SESSION_KEY); location.hash=""; location.reload(); }

/* ---------- data ---------- */
function visibleDashboards(){
  return RUNTIME.dashboards.filter(d => d.active!==false && (canSeeAll() || (d.roles||[]).includes(session.role)));
}
function dashById(id){ return RUNTIME.dashboards.find(d=>d.id===id); }

async function loadRemoteConfig(background){
  if(session.mode!=="api") return;
  const cached = localStorage.getItem("mersi_hub_cfgcache");
  if(cached && !background){ try{ Object.assign(RUNTIME, JSON.parse(cached)); }catch(e){} }
  const r = await api("getConfig");
  if(r.ok){
    RUNTIME.categories = r.categories?.length ? r.categories : CFG.categories;
    RUNTIME.dashboards = r.dashboards?.length ? r.dashboards : CFG.dashboards;
    RUNTIME.roles      = r.roles?.length      ? r.roles      : baseRoles();
    RUNTIME.announcement = r.announcement;
    localStorage.setItem("mersi_hub_cfgcache", JSON.stringify(RUNTIME));
    renderSidebar();
    if(!currentDash && !$("homeView").classList.contains("hidden") && !$("homeView")._adm) renderHome($("homeView")._filterCat);
  }
}

/* ---------- boot ---------- */
function enterApp(){
  $("loginView").classList.add("hidden");
  $("appView").classList.remove("hidden");
  $("uAvatar").textContent = (session.displayName||session.username)[0].toUpperCase();
  $("uName").textContent = session.displayName||session.username;
  $("uRole").textContent = session.role + (session.mode==="api" ? " · sheet" : " · local");
  $("uRole").title = roleLabel(session.role);
  renderSidebar(); renderHome();
  tickClock(); setInterval(tickClock, 1000);
  loadRemoteConfig();
  routeFromHash();
}
function initBrand(){
  $("loginLogo").innerHTML = logoHTML("XL");
  $("sbLogo").innerHTML = logoHTML("SM");
  $("brandTagline").textContent = CFG.brand.tagline||"";
  $("sbName").textContent = CFG.brand.name;
  $("sbSub").textContent = CFG.brand.sub||"";
  document.title = `${CFG.brand.name} Marketing Hub`;
}
function tickClock(){
  const now = new Date();
  $("clockTime").textContent = now.toLocaleTimeString("th-TH",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
  const h = now.getHours();
  const g = h<11?"สวัสดีตอนเช้า":h<16?"สวัสดีตอนบ่าย":h<19?"สวัสดีตอนเย็น":"สวัสดีตอนค่ำ";
  $("greetLine").textContent = `${g}, คุณ${session.displayName||session.username}`;
  $("dateLine").textContent = now.toLocaleDateString("th-TH",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
}

/* ---------- sidebar ---------- */
function renderSidebar(){
  const dashes = visibleDashboards();
  let html = `<div class="sbSection">เมนูหลัก</div>
    <button class="navItem active" data-nav="home" onclick="goHome()"><span class="ic">⌂</span> หน้าแรก</button>
    <button class="navItem" data-nav="fav" onclick="goHome('fav')"><span class="ic">★</span> รายการโปรด<span class="cnt">${store("fav").length||""}</span></button>
    <div class="sbSection">หมวดหมู่</div>`;
  RUNTIME.categories.forEach(c=>{
    const n = dashes.filter(d=>d.category===c.id).length;
    if(!n) return;
    html += `<button class="navItem" data-nav="cat-${c.id}" onclick="goHome('${c.id}')"><span class="ic">${esc(c.icon||"◈")}</span> ${esc(c.label)}<span class="cnt">${n}</span></button>`;
  });
  if(canManage()){
    html += `<div class="sbSection">ระบบ</div>
      <button class="navItem" data-nav="admin" onclick="showAdmin()"><span class="ic">⚙</span> ศูนย์ควบคุมระบบ</button>`;
  }
  $("sbNav").innerHTML = html;
}
function setActiveNav(key){
  document.querySelectorAll(".navItem").forEach(el=>el.classList.toggle("active", el.dataset.nav===key));
}
function toggleSidebar(force){
  const sb=$("sidebar"), open = force!==undefined?force:!sb.classList.contains("open");
  sb.classList.toggle("open",open); $("scrim").classList.toggle("show",open);
}

/* ---------- home ---------- */
function isLive(d){ return (d.tags||[]).some(t=>/real.?time/i.test(t)); }
function cardHTML(d, i){
  const cat = RUNTIME.categories.find(c=>c.id===d.category);
  const fav = store("fav").includes(d.id);
  const hint = d.embed!==false ? "เปิดใน Hub →" : "เปิดแท็บใหม่ ↗";
  const live = isLive(d) ? `<span class="dot" title="Real-time"></span>` : "";
  return `<div class="card" style="--i:${i}" onclick="openDash('${d.id}')">
    <button class="starBtn ${fav?"faved":""}" onclick="event.stopPropagation();toggleFav('${d.id}')">${fav?"★":"☆"}</button>
    <div class="cardTop"><div class="medal">${esc(d.icon||"◈")}</div>
      <div><div class="tt">${esc(d.title)}</div><div class="cat">${esc(cat?.label||d.category||"")} ${live}</div></div></div>
    <div class="desc">${esc(d.desc||"")}</div>
    <div class="cardFoot">${(d.tags||[]).slice(0,3).map(t=>`<span class="chip">${esc(t)}</span>`).join("")}<span class="openHint">${hint}</span></div>
  </div>`;
}
function sectionHTML(title, cards){
  if(!cards.length) return "";
  return `<div class="sectionHead"><h3>${esc(title)}</h3><div class="rule"></div></div><div class="grid">${cards.join("")}</div>`;
}
function announceHTML(){
  const a = RUNTIME.announcement || JSON.parse(localStorage.getItem("mersi_hub_announce")||"null");
  if(!a || !a.text || sessionStorage.getItem("annHide")===a.text) return "";
  return `<div class="announce ${a.level==="warn"?"warn":""}"><span>✦</span><span>${esc(a.text)}</span>
    <button class="ax" onclick="sessionStorage.setItem('annHide',${JSON.stringify(a.text).replace(/"/g,"&quot;")});this.parentElement.remove()">✕</button></div>`;
}
function countUp(el, target){
  let v=0; const step = Math.max(1, Math.ceil(target/28));
  const tick=()=>{ v=Math.min(target, v+step); el.textContent=v; if(v<target) requestAnimationFrame(tick); };
  requestAnimationFrame(tick);
}
function renderHome(filterCat){

    html += favs.length ? sectionHTML("★ รายการโปรด",favs) : `<div class="emptyNote">ยังไม่มีรายการโปรด — กด ☆ บนการ์ดเพื่อบันทึก</div>`;

    html += sectionHTML(cat?.label||filterCat, dashes.filter(d=>d.category===filterCat).map(d=>cardHTML(d,i++))) || `<div class="emptyNote">ไม่พบ dashboard ในหมวดนี้</div>`;

    const recs = recIds.map(dashById).filter(d=>d && dashes.includes(d)).slice(0,4).map(d=>cardHTML(d,i++));
    html += sectionHTML("เปิดล่าสุด",recs);
    RUNTIME.categories.forEach(c=>{ html += sectionHTML(c.label, dashes.filter(d=>d.category===c.id).map(d=>cardHTML(d,i++))); });
    setActiveNav("home");

  $("homeView").innerHTML = html;
  $("homeView")._filterCat = filterCat;

let MD = null;
function openModal(cfg){
  MD = cfg;
  $("mdTitle").textContent = cfg.title || "";
  $("mdSub").textContent = cfg.subtitle || "";
  $("mdErr").textContent = "";
  $("mdSave").textContent = cfg.saveLabel || "บันทึก";
  $("mdForm").innerHTML = (cfg.fields||[]).map(mdFieldHTML).join("");
  $("mdWrap").classList.add("open");
  setTimeout(()=>{ const el = $("mdForm").querySelector("input:not([disabled]),select,textarea"); if(el) el.focus(); }, 90);
}
function closeModal(){ $("mdWrap").classList.remove("open"); MD = null; }
function mdFieldHTML(f){
  const id = "mdf_" + f.key;
  const hint = f.hint ? `<p class="fHint">${esc(f.hint)}</p>` : "";
  const req  = f.required ? " *" : "";
  if(f.type === "checkbox")
    return `<label class="mdChk" style="margin-bottom:15px"><input type="checkbox" id="${id}" ${f.value?"checked":""}><span>${esc(f.label)}</span></label>${hint}`;
  if(f.type === "checks")
    return `<div class="field"><label>${esc(f.label)}${req}</label>
      <div class="chkGrid" id="${id}">${(f.options||[]).map(o=>`<label class="mdChk"><input type="checkbox" value="${esc(o.value)}" ${(f.value||[]).includes(o.value)?"checked":""}><span>${esc(o.label)}</span></label>`).join("")}</div>${hint}</div>`;
  if(f.type === "select")
    return `<div class="field"><label>${esc(f.label)}${req}</label>
      <select id="${id}">${(f.options||[]).map(o=>`<option value="${esc(o.value)}" ${String(f.value)===String(o.value)?"selected":""}>${esc(o.label)}</option>`).join("")}</select>${hint}</div>`;
  if(f.type === "textarea")
    return `<div class="field"><label>${esc(f.label)}${req}</label><textarea id="${id}" placeholder="${esc(f.placeholder||"")}">${esc(f.value||"")}</textarea>${hint}</div>`;
  return `<div class="field"><label>${esc(f.label)}${req}</label>
    <input id="${id}" type="${f.type||"text"}" value="${esc(f.value??"")}" placeholder="${esc(f.placeholder||"")}" ${f.disabled?"disabled":""}>${hint}</div>`;
}
function mdValues(){
  const out = {};
  (MD?.fields||[]).forEach(f=>{
    const el = $("mdf_"+f.key); if(!el) return;
    if(f.type === "checkbox") out[f.key] = el.checked;
    else if(f.type === "checks") out[f.key] = [...el.querySelectorAll("input:checked")].map(x=>x.value);
    else out[f.key] = String(el.value||"").trim();
  });
  return out;
}
async function mdSubmit(){
  if(!MD) return;
  const v = mdValues();
  const miss = (MD.fields||[]).find(f=>f.required && (v[f.key]===""||v[f.key]===undefined||(Array.isArray(v[f.key])&&!v[f.key].length)));
  if(miss){ $("mdErr").textContent = "กรอก “"+miss.label+"” ก่อนครับ"; return; }
  const btn = $("mdSave"), old = btn.textContent;
  btn.textContent = "กำลังบันทึก…"; btn.disabled = true; $("mdErr").textContent = "";
  try{
    const err = await MD.onSave(v);
    if(err){ $("mdErr").textContent = err; }
    else closeModal();
  }catch(e){ $("mdErr").textContent = "ผิดพลาด: " + (e&&e.message||e); }
  btn.textContent = old; btn.disabled = false;
}

function pwCell(u){
  const p = u.tempPassword || "";
  if(!p) return `<span class="fHint" title="เจ้าตัวเข้าใช้แล้ว ระบบลบรหัสออกเพื่อความปลอดภัย — ถ้าลืม กด “⟳ รหัส” ตั้งใหม่ได้">— ใช้แล้ว</span>`;
  return `<button class="pwChip" title="คลิกเพื่อคัดลอก" onclick="copyPw(this,${JSON.stringify(p).replace(/"/g,"&quot;")})">${esc(p)} <span class="pwCopy">⎘</span></button>
    <div class="fHint">ยังไม่เข้าใช้</div>`;

function copyPw(el, txt){
  navigator.clipboard.writeText(txt).then(()=>{
    const old = el.innerHTML; el.classList.add("ok"); el.innerHTML = "คัดลอกแล้ว ✓";
    setTimeout(()=>{ el.classList.remove("ok"); el.innerHTML = old; }, 1400);
  }).catch(()=>toast("คัดลอกไม่ได้ — ลองเลือกข้อความเอง"));
}

    fields: [
      { key:"username", label:"Username (ใช้ล็อกอิน)", value:u?.username||"", required:!edit, disabled:edit,

      { key:"displayName", label:"ชื่อที่แสดง", value:u?.displayName||"", placeholder:"เช่น คุณเอ — ฝ่าย IT" },
      { key:"role", label:"บทบาท (Role)", type:"select", options:roleOptions(), value:u?.role||"marketing",
        hint:"เพิ่ม/แก้บทบาทได้ที่แท็บ “บทบาท & สิทธิ์”" },
      { key:"pass", label: edit?"รหัสผ่านใหม่ (ถ้าต้องการเปลี่ยน)":"รหัสผ่าน", type:"text", value:"", required:!edit,
        hint:"เก็บเป็น SHA-256 · รหัสจะโชว์ในคอลัมน์ “รหัสปัจจุบัน” จนเจ้าตัวเข้าใช้ครั้งแรก" },

      { key:"active", label:"เปิดใช้งานบัญชีนี้", type:"checkbox", value: edit ? !!u.active : true },
    ],

      const payload = { username, displayName:v.displayName||username, role:v.role, note:v.note, active:!!v.active, hash, plain: v.pass||"" };
      if(isApiMode()){
        const r = await api(edit ? "updateUser" : "addUser", payload);
        if(!r.ok) return r.error==="USER_EXISTS" ? "มี username นี้อยู่แล้ว"
          : r.error==="UNKNOWN_ACTION" ? "Apps Script เวอร์ชันเก่า — ต้อง Deploy Code.gs ใหม่" : "บันทึกไม่สำเร็จ ("+(r.error||"")+")";
      }else{
        const patch = { username, displayName:payload.displayName, role:v.role, note:v.note, active:!!v.active, deleted:false };
        if(hash) patch.passwordHash = hash;
        if(!edit && !hash) return "กรอกรหัสผ่านก่อนครับ";
        upsertLocalUser(username, patch);
      }
      await admRefresh(edit ? "บันทึกการแก้ไขแล้ว ✓" : `สร้างผู้ใช้ ${username} สำเร็จ ✓`);
    }
  });

async function admDelete(u){

  else upsertLocalUser(u.username, { deleted:true, active:false });

async function dashMove(i, dir){

  else saveLocalDash(list.map(d=>({...d})));

/* ---------------- TAB 5 · ประกาศ ---------------- */
function admAnnounceTab(){
  const a = RUNTIME.announcement || lsGet("mersi_hub_announce") || {};
  $("admBody").innerHTML = `
  <div class="panel"><h4>📣 ประกาศบนหน้าแรก</h4>
    <p class="ps">ข้อความจะขึ้นแถบบนสุดของหน้าแรกให้ทุกคนเห็น — เว้นว่างแล้วบันทึก = ลบประกาศ</p>
    <div class="formRow">
      <div class="field" style="flex:3"><label>ข้อความประกาศ</label><input id="annText" type="text" value="${esc(a.text||"")}" placeholder="เช่น ระบบจะปิดปรับปรุงวันเสาร์ 20:00–22:00"></div>
      <div class="field" style="max-width:150px"><label>ระดับ</label><select id="annLevel">
        <option value="info" ${a.level!=="warn"?"selected":""}>ทั่วไป</option>
        <option value="warn" ${a.level==="warn"?"selected":""}>สำคัญ</option></select></div>
      <button class="btnMini primary" onclick="admAnnounce()">บันทึกประกาศ</button>
    </div>
  </div>`;
}
async function admAnnounce(){
  const text = $("annText").value.trim(), level = $("annLevel").value;
  if(isApiMode()){
    const r = await api("setAnnouncement",{ text, level });
    if(r.ok){ RUNTIME.announcement = text?{text,level}:null; toast("บันทึกประกาศแล้ว ✓"); }
    else toast("บันทึกไม่สำเร็จ");
  }else{
    if(text) lsSet("mersi_hub_announce",{text,level}); else localStorage.removeItem("mersi_hub_announce");
    RUNTIME.announcement = text?{text,level}:null;
    toast("บันทึกประกาศแล้ว (เครื่องนี้) ✓");
  }
  sessionStorage.removeItem("annHide");
}

/* ---------------- TAB 6 · เชื่อมต่อ & สำรองข้อมูล ---------------- */
function admConnTab(){
  $("admBody").innerHTML = `
  <div class="panel"><h4>⚡ การเชื่อมต่อ Google Sheet</h4>
    <p class="ps">วาง URL ของ Apps Script Web App (ลงท้าย <code>/exec</code>) — เมื่อเชื่อมแล้วผู้ใช้และ dashboard จะใช้ร่วมกันทุกเครื่อง ·
      สถานะ: <b>${isApiMode()?"● เชื่อมต่อแล้ว":"○ โหมดในเครื่อง"}</b></p>
    <div class="formRow">
      <div class="field" style="flex:3"><label>Web App URL</label><input id="admApi" type="text" placeholder="https://script.google.com/macros/s/…/exec" value="${esc(apiUrl())}"></div>
      <button class="btnMini" onclick="admTest()">ทดสอบ</button>
      <button class="btnMini primary" onclick="admSaveApi()">บันทึก</button>
    </div>
    <p class="ps" id="admApiMsg" style="margin:10px 0 0"></p>
  </div>

  <div class="panel"><h4>💾 สำรอง / กู้คืนข้อมูลตั้งค่า</h4>
    <p class="ps">ไฟล์สำรองครอบคลุม บทบาท · หมวดหมู่ · dashboard (ไม่รวมรหัสผ่านผู้ใช้)</p>
    <div class="formRow">
      <button class="btnMini" onclick="admBackup()">⤓ ดาวน์โหลดไฟล์สำรอง (.json)</button>
      <button class="btnMini" onclick="$('impFile').click()">⤒ กู้คืนจากไฟล์</button>
      <input type="file" id="impFile" accept=".json" class="hidden" onchange="admRestore(this)">
    </div>
    <div class="hintBox">โหมดในเครื่อง: กด <b>“คัดลอกไฟล์ config”</b> ด้านล่างแล้ววางทับไฟล์ <code>dashboards.config.js</code>
      เพื่อให้ค่าที่ตั้งไว้กลายเป็นค่าเริ่มต้นของทุกเครื่อง</div>
    <div class="formRow" style="margin-top:12px">
      <button class="btnMini" onclick="admCopyConfig()">⎘ คัดลอกไฟล์ config ทั้งไฟล์</button>
      <button class="btnMini" onclick="admDownloadConfig()">⤓ ดาวน์โหลด dashboards.config.js</button>
    </div>
  </div>

  <div class="panel"><h4>🧹 ล้างค่าที่บันทึกในเครื่องนี้</h4>
    <p class="ps">ใช้เมื่อทดลองแก้ในเครื่องแล้วอยากกลับไปใช้ค่าจากไฟล์ config / Google Sheet</p>
    <button class="btnMini danger" onclick="admClearLocal()">ล้างข้อมูลในเครื่อง (localStorage)</button>
  </div>`;
}
async function admTest(){
  const url = $("admApi").value.trim();
  $("admApiMsg").textContent = "กำลังทดสอบ…";
  try{
    const r = await fetch(url,{ method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify({action:"ping"}) });
    const j = await r.json();
    $("admApiMsg").textContent = j.ok ? "✓ เชื่อมต่อสำเร็จ — "+j.name+(j.version?" ("+j.version+")":"") : "✕ ตอบกลับไม่ถูกต้อง";
  }catch(e){ $("admApiMsg").textContent = "✕ เชื่อมต่อไม่ได้ — ตรวจ URL และการ Deploy (Who has access: Anyone)"; }
}
function admSaveApi(){
  const url = $("admApi").value.trim();
  if(url) localStorage.setItem("mersi_hub_api", url); else localStorage.removeItem("mersi_hub_api");
  toast("บันทึกแล้ว — กำลังเข้าสู่ระบบใหม่เพื่อใช้การเชื่อมต่อ");
  setTimeout(logout, 1300);
}
function dl(name, text, type){
  const b = new Blob([text], { type: type||"application/json;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(b); a.download = name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}
function admBackup(){
  const data = { _type:"mersi-hub-backup", savedAt:new Date().toISOString(),
    roles:ADM.roles||[], categories:ADM.cats||[], dashboards:ADM.dash||[] };
  dl(`mersi-hub-backup-${new Date().toISOString().slice(0,10)}.json`, JSON.stringify(data,null,2));
  toast("ดาวน์โหลดไฟล์สำรองแล้ว ✓");
}
async function admRestore(input){
  const file = input.files?.[0]; if(!file) return;
  input.value = "";
  try{
    const data = JSON.parse(await file.text());
    if(!data || (!data.dashboards && !data.categories && !data.roles)) { toast("ไฟล์ไม่ถูกต้อง"); return; }
    if(!confirm("กู้คืนข้อมูลจากไฟล์นี้? ค่าที่มีอยู่ที่ ID ตรงกันจะถูกเขียนทับ")) return;
    if(isApiMode()){
      for(const r of (data.roles||[])) await api("saveRole", r);
      for(const c of (data.categories||[])) await api("saveCategory", c);
      for(const d of (data.dashboards||[])) await api("saveDashboard", d);
    }else{
      if(data.roles?.length) saveLocalRoles(data.roles);
      if(data.categories?.length) saveLocalCats(data.categories);
      if(data.dashboards?.length) saveLocalDash(data.dashboards);
    }
    await admRefresh("กู้คืนข้อมูลแล้ว ✓");
  }catch(e){ toast("อ่านไฟล์ไม่สำเร็จ: "+(e.message||e)); }
}
function buildConfigFile(){
  const J = v => JSON.stringify(v);
  const users = allLocalUsers().filter(u=>u.passwordHash && u.passwordHash!=="-");
  return `/* ============================================================
   MERSI MARKETING HUB — CONFIG
   สร้างอัตโนมัติจากศูนย์ควบคุมระบบ · ${new Date().toLocaleString("th-TH")}
   ============================================================ */

window.HUB_CONFIG = {

  brand: ${JSON.stringify(CFG.brand, null, 4).replace(/\n/g,"\n  ")},

  api: { url: ${J(apiUrl())} },

  /* ---------- บทบาท & สิทธิ์ ---------- */
  roles: [
${(ADM.roles||[]).map(r=>`    { id:${J(r.id)}, label:${J(r.label)}, manage:${!!r.manage}, allDash:${!!r.allDash} },`).join("\n")}
  ],

  /* ---------- ผู้ใช้ (passwordHash = SHA-256) ---------- */
  users: [
${users.map(u=>`    { username:${J(u.username)}, displayName:${J(u.displayName||u.username)}, role:${J(u.role)},\n      passwordHash:${J(u.passwordHash)}${u.active===false?", active:false":""} },`).join("\n")}
  ],

  /* ---------- หมวดหมู่ ---------- */
  categories: [
${(ADM.cats||[]).map(c=>`    { id:${J(c.id)}, label:${J(c.label)}, icon:${J(c.icon||"◈")} },`).join("\n")}
  ],

  /* ---------- DASHBOARDS ---------- */
  dashboards: [
${(ADM.dash||[]).map(d=>`    {
      id:${J(d.id)}, title:${J(d.title)},
      desc:${J(d.desc||"")},
      category:${J(d.category)}, icon:${J(d.icon||"◈")},
      url:${J(d.url)},
      embed:${d.embed!==false}, roles:${J(d.roles||[])},
      tags:${J(d.tags||[])}${d.active===false?", active:false":""},
    },`).join("\n")}
  ],
};
`;
}
function admCopyConfig(){
  const txt = buildConfigFile();
  navigator.clipboard.writeText(txt)
    .then(()=>toast("คัดลอกแล้ว — วางทับไฟล์ dashboards.config.js"))
    .catch(()=>{ dl("dashboards.config.js", txt, "text/javascript;charset=utf-8"); toast("คัดลอกไม่ได้ — ดาวน์โหลดไฟล์ให้แล้ว"); });
}
function admDownloadConfig(){ dl("dashboards.config.js", buildConfigFile(), "text/javascript;charset=utf-8"); toast("ดาวน์โหลดแล้ว ✓"); }
function admClearLocal(){
  if(!confirm("ล้างผู้ใช้/dashboard/หมวดหมู่/บทบาท ที่บันทึกในเครื่องนี้?")) return;
  [LS.users, LS.dash, LS.cats, LS.roles, "mersi_hub_cfgcache", "mersi_hub_announce"].forEach(k=>localStorage.removeItem(k));
  toast("ล้างแล้ว — กำลังโหลดหน้าใหม่"); setTimeout(()=>location.reload(), 1000);
}

/* ---------------- TAB 7 · สถิติ ---------------- */
async function admStatsTab(){
  if(!isApiMode()){
    $("admBody").innerHTML = `<div class="panel"><h4>📊 สถิติการใช้งาน</h4>
      <p class="ps">ต้องเชื่อม Google Sheet ก่อนจึงจะเก็บสถิติการเปิดใช้ได้</p>
      <button class="btnMini" onclick="showAdmin('conn')">⚡ ไปตั้งค่าการเชื่อมต่อ</button></div>`;
    return;
  }
  $("admBody").innerHTML = `<div class="panel"><h4>📊 สถิติการใช้งาน</h4><div id="admStats"><p class="ps">กำลังโหลด…</p></div></div>`;
  const r = await api("stats"); const box = $("admStats"); if(!box) return;
  if(!r.ok){ box.innerHTML = `<p class="ps">โหลดสถิติไม่สำเร็จ (${esc(r.error||"")})</p>`; return; }
  const max = Math.max(1, ...((r.topDashboards||[]).map(t=>t.count)));
  box.innerHTML = `
    <div class="statRow" style="margin:0 0 18px">
      <div class="statChip"><span class="v">${r.openCount}</span><span class="l">ครั้งที่เปิดใช้</span></div>
      <div class="statChip"><span class="v">${r.userCount}</span><span class="l">ผู้ใช้ทั้งหมด</span></div>
    </div>
    <p class="ps" style="margin-bottom:8px">Dashboard ยอดนิยม</p>
    ${(r.topDashboards||[]).map(t=>{ const d=dashById(t.id);
      return `<div class="barRow"><span class="n">${esc(d?.title||t.id)}</span><div class="barTrack"><div class="barFill" style="width:${Math.round(t.count/max*100)}%"></div></div><span>${t.count}</span></div>`;
    }).join("") || '<p class="ps">ยังไม่มีข้อมูล</p>'}
    <p class="ps" style="margin:16px 0 6px">กิจกรรมล่าสุด</p>
    <div class="tblWrap"><table class="tbl">${(r.recent||[]).slice(0,15).map(a=>`<tr>
      <td style="color:var(--ink-soft);font-size:13px;white-space:nowrap">${esc(a.time)}</td>
      <td><b>${esc(a.user)}</b></td><td>${esc(a.action)}</td>
      <td style="color:var(--ink-soft)">${esc(a.detail)}</td></tr>`).join("")}</table></div>`;
}

/* ============================================================
   COMMAND PALETTE
   ============================================================ */
function palItems(){
  const q = $("palInput").value.trim().toLowerCase();
  let list = visibleDashboards();
  if(q) list = list.filter(d=>[d.title,d.desc,d.category,(d.tags||[]).join(" ")].join(" ").toLowerCase().includes(q));
  else { const rec = store("recent").map(dashById).filter(Boolean); list = [...rec, ...list.filter(d=>!rec.includes(d))]; }
  return list.slice(0,12);
}
function openPal(){ $("palWrap").classList.add("open"); $("palInput").value=""; palSel=0; renderPal(); setTimeout(()=>$("palInput").focus(),60); }
function closePal(){ $("palWrap").classList.remove("open"); }
function renderPal(){
  const items = palItems(); palSel = Math.min(palSel, Math.max(0,items.length-1));
  $("palList").innerHTML = items.map((d,i)=>{
    const cat = RUNTIME.categories.find(c=>c.id===d.category);
    return `<button class="palItem ${i===palSel?"sel":""}" onclick="closePal();openDash('${d.id}')">
      <div class="medal">${esc(d.icon||"◈")}</div>
      <div><div class="t">${esc(d.title)}</div><div class="c">${esc(cat?.label||"")}</div></div>
      <span class="go">${d.embed!==false?"เปิด →":"แท็บใหม่ ↗"}</span></button>`;
  }).join("") || `<div class="emptyNote" style="margin:10px">ไม่พบผลลัพธ์</div>`;
}
document.addEventListener("keydown",e=>{
  if($("mdWrap").classList.contains("open")){
    if(e.key==="Escape"){ e.preventDefault(); closeModal(); }
    if(e.key==="Enter" && e.target.tagName!=="TEXTAREA" && e.target.id!=="mdSave"){ e.preventDefault(); mdSubmit(); }
    return;
  }
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="k"){ e.preventDefault(); $("palWrap").classList.contains("open")?closePal():openPal(); return; }
  if($("palWrap").classList.contains("open")){
    const items = palItems();
    if(e.key==="ArrowDown"){ e.preventDefault(); palSel=Math.min(palSel+1,items.length-1); renderPal(); }
    if(e.key==="ArrowUp"){ e.preventDefault(); palSel=Math.max(palSel-1,0); renderPal(); }
    if(e.key==="Enter"){ e.preventDefault(); const d=items[palSel]; if(d){ closePal(); openDash(d.id); } }
    if(e.key==="Escape") closePal();
    return;
  }
  if(e.key==="Escape" && currentDash) goHome();
});

/* ---------- init ---------- */
applyTheme(localStorage.getItem("mersi_hub_theme")||"light");
initBrand();
session = loadSession();
if(session) enterApp();
</script>
